<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Репетитор — Амир и Самир</title></head><body>
<div id="login" class="screen"><div class="login-card"><h1>🎓 Репетитор</h1><p>Амир и Самир • 6 класс</p><div class="student-buttons"><button onclick="selectStudent('amir')">Амир</button><button onclick="selectStudent('samir')">Самир</button></div><div id="pinBox" hidden><h3 id="selectedName"></h3><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="primary" onclick="login()">Войти</button><div id="loginError" class="feedback bad"></div></div></div></div>
<div id="dashboard" class="screen" hidden><header><div><div class="eyebrow">Личный кабинет</div><h1 id="studentName"></h1></div><button onclick="logout()">Выйти</button></header><main><div class="hero"><div><h2>Начать урок</h2><p>Сначала выбери предмет, затем тему. Идём по программе последовательно.</p></div><button class="primary big" onclick="chooseSubject()">Начать урок →</button></div><p id="oldNotice" class="notice"></p><h2>Мой прогресс</h2><div id="progressGrid" class="progress-grid"></div></main></div>
<div id="subjectChooser" class="overlay" hidden><div class="chooser"><button class="close" onclick="hide('subjectChooser')">×</button><h2>Выбери предмет</h2><div class="subject-grid"></div></div></div>
<div id="lesson" class="screen" hidden></div><script src="app.js"></script></body></html>
